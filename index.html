<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakuraTour - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="login-container">

        <section class="illustration-section" aria-label="Artwork Branding">
            <video autoplay loop muted playsinline class="bg-video">
                <source src="assets/video-bg.mp4" type="video/mp4">
            </video>
        </section>

        <section class="form-section">
            <div class="form-wrapper">
                
                <div class="brand-header">
                    <img src="assets/logo.png" alt="SakuraChan Logo" class="brand-logo">
                    <h2>Welcome back</h2>
                </div>

                <button type="button" class="btn-sso" aria-label="Sign in with Google">
                    <img src="assets/google-icon.png" alt="" class="sso-icon" aria-hidden="true">
                    <span>Continue with Google</span>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <form action="#" method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="username">Enter email or username</label>
                        <input type="text" id="username" name="username" placeholder="Email or Username" required>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-password">Forgot Password?</a>
                        </div>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember Me</label>
                    </div>

                    <button type="submit" class="btn-submit">Sign In</button>
                </form>

                <p class="terms-text">
                    By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
                </p>
                <p class="signup-text">
                    Don't have an account? <a href="#">Sign up</a>
                </p>

            </div>
        </section>

    </main>

</body>
</html>
